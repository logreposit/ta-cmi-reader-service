version: 2.1


orbs:
  maven: circleci/maven@2.1.1
  codecov: codecov/codecov@5.4.3


executors:
  build-container:
    environment:
      _JAVA_OPTIONS: "-Xmx512m"
    docker:
      - image: cimg/openjdk:21.0


jobs:
  compile:
    executor: build-container
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - cmi-reader-service-{{ checksum "pom.xml" }}
            - cmi-reader-service-
      - run:
          name: Checking version in pom.xml
          command: |
            version=$(mvn -Dexec.executable='echo' -Dexec.args='${project.version}' --non-recursive exec:exec -q)
            if [ "$version" != "SNAPSHOT" ]; then
                echo "Version in pom.xml is not set to SNAPSHOT"
                exit 1
            fi
            # Setting version so that it's correct in `build-info.properties`
            version=$(git describe)
            mvn versions:set -DnewVersion=${version}
      - run:
          name: Downloading dependencies & compile
          command: |
            mvn -DskipTests clean install dependency:resolve-plugins dependency:go-offline
            # Setting it back to SNAPSHOT for the cache
            mvn versions:set -DnewVersion=SNAPSHOT
      - save_cache:
          paths:
            - ~/.m2
          key: cmi-reader-service-{{ checksum "pom.xml" }}
      - run:
          name: Setting version
          command: |
            # Setting version again correctly for the following steps
            version=$(git describe)
            mvn versions:set -DnewVersion=${version}
      - persist_to_workspace:
          root: /home/circleci/
          paths:
            - project/*

  tests:
    executor: build-container
    parallelism: 2
    resource_class: small
    steps:
      - attach_workspace:
          at: /home/circleci/
      - restore_cache:
          keys:
            - cmi-reader-service-{{ checksum "pom.xml" }}
            - cmi-reader-service-
      - run:
          name: Enable Test Splitting
          command: |
            mkdir -p .circleci/tests/
            # generate excluded surefire tests using provided pattern

            circleci tests glob src/test/java/**/*Test.java src/test/java/**/*Tests.java src/test/java/**/*IT.java | \
            sed -e 's#^src/test/java/\(.*\)\.java#\1#' | \
            tr "/" "." > .circleci/tests/surefire_classnames

            cat .circleci/tests/surefire_classnames | \
              circleci tests split --split-by=timings --timings-type=classname > /tmp/this_node_tests
            cat .circleci/tests/surefire_classnames | \
              grep -xvf /tmp/this_node_tests > .circleci/tests/surefire_classnames_ignore_list
      - store_artifacts:
          path: .circleci/tests/
      - run:
          name: Run Tests
          command: mvn test -B -Dsurefire.excludesFile=.circleci/tests/surefire_classnames_ignore_list
      - maven/process_test_results:
          test_results_path: ~/project/target/surefire-reports
      - codecov/upload:
          when: on_success


  build:
    executor: build-container
    resource_class: small
    steps:
      - attach_workspace:
          at: /home/circleci/
      - restore_cache:
          keys:
            - cmi-reader-service-{{ checksum "pom.xml" }}
            - cmi-reader-service-
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Setup Docker Buildx
          command: |
            export DOCKER_CLI_EXPERIMENTAL=enabled
            docker buildx create --name multiarch-builder --use
            docker buildx inspect --bootstrap
      - run:
          name: Build and Push Multi-Arch Image
          command: |
            version=$(git describe)
            docker_image_tag="logreposit/ta-cmi-reader-service:${version}"
            mvn versions:set -DnewVersion=${version}

            # build jar
            rm -f "target/ta-cmi-reader-service.jar"
            mvn -DskipTests=true package
            mv "target/ta-cmi-reader-service.jar" docker/app.jar

            # login to docker hub
            echo ${LOGREPOSIT_DOCKERHUB_PASSWORD} | docker login -u ${LOGREPOSIT_DOCKERHUB_USERNAME} --password-stdin

            # build and push multi-arch docker image
            echo "Building and pushing multi-arch docker image ${docker_image_tag} ..."
            cd ./docker
            export DOCKER_CLI_EXPERIMENTAL=enabled
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -t ${docker_image_tag} \
              --push \
              .
            echo "Successfully built and pushed multi-arch image ${docker_image_tag}"




workflows:
  base-workflow:
    jobs:
      - compile:
          context: logreposit
          filters:
            tags:
              ignore:
                - v.*
      - tests:
          context: logreposit
          requires:
            - compile

      - build:
          context: logreposit
          requires:
            - compile
            - tests

